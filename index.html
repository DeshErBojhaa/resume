<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Resume</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            position: relative;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            margin: 0 0 10px 0;
        }
        p {
            color: #666;
            margin: 0;
        }
        .download-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            z-index: 1000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .download-btn:hover {
            background-color: #0056b3;
        }
        .resume-container {
            display: flex;
            justify-content: center;
            max-width: 900px;
            margin: 0 auto;
        }
        .resume-embed {
            width: 100%;
            max-width: 850px;
            height: 900px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <a href="Tamjid_Resume.pdf" class="download-btn" download>
        Download Resume (PDF)
    </a>
    
    <div class="header">
        <p>View my resume below or download it as PDF:</p>
    </div>

    <div class="resume-container">
        <embed src="Tamjid_Resume.pdf" class="resume-embed" type="application/pdf">
    </div>
</body>
</html>
